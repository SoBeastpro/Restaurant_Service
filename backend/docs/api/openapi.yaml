      operationId: platformSystemEvents
      x-access: Platform admin
      responses:
        "200":
          $ref: "#/components/responses/Ok"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 20 }
    HallId:
      name: hallId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TableId:
      name: tableId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  requestBodies:
    JsonBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonObject"
    OptionalJsonBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonObject"
    TokenRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string }
    LoginValueRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [login]
            properties:
              login: { type: string }
    FileBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary }

  responses:
    Ok:
      description: Операция выполнена
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonObject"
    Created:
      description: Объект создан
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonObject"
    NoContent:
      description: Операция выполнена без тела ответа
    Conflict:
      description: Конфликт текущего состояния
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Error:
      description: Ошибка выполнения запроса
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    JsonObject:
      type: object
      additionalProperties: true
      description: Предварительная схема; будет заменена после утверждения ERD.

    ApiError:
      type: object
      required: [status, code, message]
      properties:
        status: { type: integer, example: 409 }
        code: { type: string, example: ACTIVE_SHIFT_ALREADY_EXISTS }
        message: { type: string, example: В ресторане уже есть активная смена }
        path: { type: string, example: /api/v1/restaurants/.../shifts/.../start }
        timestamp: { type: string, format: date-time }
        fieldErrors:
          type: object
          additionalProperties:
            type: string

    RegisterRequest:
      type: object
      required: [login, firstName, lastName, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 100
          example: anna.sokolova
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, format: password, minLength: 8 }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string, format: password }

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Срок access-токена в секундах }
        restaurants:
          type: array
          description: Рестораны, доступные в выбранном режиме входа.
          items:
            $ref: "#/components/schemas/RestaurantMembershipSummary"

    OnboardingSubscription:
      type: object
      required: [status, stub]
      properties:
        status:
          type: string
          enum: [NOT_STARTED, ACTIVE, EXPIRED]
        expiresAt:
          type: [string, "null"]
          format: date-time
        stub:
          type: boolean
          const: true
          description: Всегда true, пока реальный платёжный провайдер не подключён.

    CreateRestaurantRequest:
      type: object
      required: [name, address, openingHours]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        address: { type: string, minLength: 1, maxLength: 500 }
        openingHours:
          type: array
          minItems: 7
          maxItems: 7
          description: Каждый день недели должен присутствовать ровно один раз.
          items:
            $ref: "#/components/schemas/OpeningHoursRequest"

    OpeningHoursRequest:
      type: object
      required: [dayOfWeek, closed]
      properties:
        dayOfWeek:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        closed: { type: boolean }
        opensAt:
          type: [string, "null"]
          format: time
          example: "18:00"
        closesAt:
          type: [string, "null"]
          format: time
          example: "02:00"

    OpeningHoursResponse:
      allOf:
        - $ref: "#/components/schemas/OpeningHoursRequest"
        - type: object
          required: [closesNextDay]
          properties:
            closesNextDay:
              type: boolean
              description: Закрытие относится к следующим календарным суткам.

    RestaurantResponse:
      type: object
      required: [id, name, address, status, openingHours, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        status: { type: string, enum: [ACTIVE, BLOCKED, ARCHIVED] }
        openingHours:
          type: array
          items:
            $ref: "#/components/schemas/OpeningHoursResponse"
        createdAt: { type: string, format: date-time }

    CreateHallRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        displayOrder: { type: integer, minimum: 0, default: 0 }

    HallResponse:
      type: object
      required: [id, restaurantId, name, displayOrder, status]
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        name: { type: string }
        displayOrder: { type: integer }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }

    TableShape:
      type: string
      enum: [ROUND, SQUARE, RECTANGLE]

    CreateTableRequest:
      type: object
      required: [number, seatsCount, positionX, positionY, shape]
      properties:
        number: { type: string, minLength: 1, maxLength: 20 }
        seatsCount: { type: integer, minimum: 1, maximum: 100 }
        positionX: { type: number, minimum: 0 }
        positionY: { type: number, minimum: 0 }
        shape:
          $ref: "#/components/schemas/TableShape"

    UpdateTableRequest:
      type: object
      properties:
        number: { type: string, minLength: 1, maxLength: 20 }
        seatsCount: { type: integer, minimum: 1, maximum: 100 }
        positionX: { type: number, minimum: 0 }
        positionY: { type: number, minimum: 0 }
        shape:
          $ref: "#/components/schemas/TableShape"

    TableResponse:
      type: object
      required: [id, restaurantId, hallId, number, seatsCount, positionX, positionY, shape, status]
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        hallId: { type: string, format: uuid }
        number: { type: string }
        seatsCount: { type: integer }
        positionX: { type: number }
        positionY: { type: number }
        shape:
          $ref: "#/components/schemas/TableShape"
        status:
          type: string
          enum: [READY, NEEDS_CLEANING, NEEDS_SERVING, PROBLEM]

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, format: password, minLength: 8 }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8 }

    EmployeePosition:
      type: string
      enum: [WAITER, RUNNER]

    RestaurantRole:
      type: string
      enum: [SYSTEM_ADMIN, DIRECTOR, MANAGER, EMPLOYEE]

    ProfileType:
      type: string
      enum: [MANAGER, EMPLOYEE]

    RestaurantMembershipSummary:
      type: object
      required: [restaurantId, restaurantName, position, status]
      properties:
        restaurantId: { type: string, format: uuid }
        restaurantName: { type: string }
        position:
          $ref: "#/components/schemas/EmployeePosition"
        status:
          $ref: "#/components/schemas/EmployeeStatus"

    EmployeeStatus:
      type: string
      enum: [INVITED, ACTIVE, INACTIVE, BLOCKED, ARCHIVED]
      description: Статус профиля пользователя в конкретном ресторане.

    EmployeeResponse:
      type: object
      required: [membershipId, userId, firstName, lastName, position, status]
      properties:
        membershipId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        position:
          $ref: "#/components/schemas/EmployeePosition"
        status:
          $ref: "#/components/schemas/EmployeeStatus"

    InvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]

    CreateInvitationRequest:
      type: object
      required: [firstName, lastName, role]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: Анна
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: Соколова
        role:
          type: string
          enum: [MANAGER, EMPLOYEE]
        position:
          $ref: "#/components/schemas/EmployeePosition"

    InvitationResponse:
      type: object
      required: [id, employeeId, restaurantId, firstName, lastName, role, status, expiresAt]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        firstName: { type: string, example: Анна }
        lastName: { type: string, example: Соколова }
        role:
          type: string
          enum: [MANAGER, EMPLOYEE]
        position:
          $ref: "#/components/schemas/EmployeePosition"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        invitationUrl: { type: string, format: uri }
        qrContent:
          type: string
          description: Содержимое QR-кода; совпадает с безопасной ссылкой.
        expiresAt: { type: string, format: date-time }

    PublicInvitationResponse:
      type: object
      required: [restaurantId, firstName, lastName, role, expiresAt]
      properties:
        restaurantId: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        role:
          type: string
          enum: [MANAGER, EMPLOYEE]
        position:
          $ref: "#/components/schemas/EmployeePosition"
        expiresAt: { type: string, format: date-time }

    AcceptInvitationRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 100
          example: anna.sokolova
          description: Устанавливается один раз и после активации аккаунта не изменяется.
        password:
          type: string
          format: password
          minLength: 8
          description: Создаёт пароль для нового аккаунта или подтверждает существующий аккаунт.

    UpdateEmployeeRequest:
      type: object
      minProperties: 1
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        position:
          $ref: "#/components/schemas/EmployeePosition"

    TableStatus:
      type: string
      enum: [NEEDS_CLEANING, NEEDS_SERVING, READY, PROBLEM]

    ChangeTableStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/TableStatus"
        comment:
          type: string
          minLength: 1
          maxLength: 1000
          description: Обязателен для статуса PROBLEM.
      allOf:
        - if:
            properties:
              status:
                const: PROBLEM
            required: [status]
          then:
            required: [comment]

    TableStatusResponse:
      type: object
      required: [tableId, tableNumber, shiftId, status, changedByMembershipId, changedAt]
      properties:
        tableId: { type: string, format: uuid }
        tableNumber: { type: string }
        shiftId: { type: string, format: uuid }
        status:
          $ref: "#/components/schemas/TableStatus"
        comment: { type: [string, "null"] }
        changedByMembershipId: { type: string, format: uuid }
        changedAt: { type: string, format: date-time }

    TableStatusHistoryResponse:
      type: object
      required:
        [id, tableId, tableNumber, shiftId, changedByMembershipId, oldStatus, newStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        tableId: { type: string, format: uuid }
        tableNumber: { type: string }
        shiftId: { type: string, format: uuid }
        changedByMembershipId: { type: string, format: uuid }
        oldStatus:
          $ref: "#/components/schemas/TableStatus"
        newStatus:
          $ref: "#/components/schemas/TableStatus"
        comment: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    NotificationResponse:
      type: object
      required: [id, type, title, message, payload, createdAt]
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: [string, "null"], format: uuid }
        type:
          type: string
          enum: [TABLE_STATUS_CHANGED, TABLE_NEEDS_CLEANING, TABLE_NEEDS_SERVING]
        title: { type: string }
        message: { type: string }
        payload:
          type: object
          additionalProperties: true
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    TaskStatus:
      type: string
      enum: [CREATED, IN_PROGRESS, COMPLETED, CANCELLED]
      description: |
        Сотрудник: CREATED → IN_PROGRESS → COMPLETED.
        Менеджер: CREATED или IN_PROGRESS → COMPLETED или CANCELLED.

    TaskDeadlineType:
      type: string
      enum: [NONE, TIME, SHIFT_END]
      description: SHIFT_END означает дедлайн к окончанию выбранной смены.

    CreateShiftTaskRequest:
      type: object
      required: [description, assignedToMembershipId, deadlineType]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
          description: Название и описание задачи — одно поле в MVP.
        assignedToMembershipId: { type: string, format: uuid }
        deadlineType:
          $ref: "#/components/schemas/TaskDeadlineType"
        deadlineAt:
          type: string
          format: date-time
          description: Обязательно только при deadlineType=TIME.

    TaskResponse:
      type: object
      required:
        [id, shiftId, description, assignedToMembershipId, status, deadlineType, createdAt]
      properties:
        id: { type: string, format: uuid }
        shiftId: { type: [string, "null"], format: uuid }
        description: { type: string }
        assignedToMembershipId: { type: [string, "null"], format: uuid }
        status:
          $ref: "#/components/schemas/TaskStatus"
        deadlineType:
          $ref: "#/components/schemas/TaskDeadlineType"
        deadlineAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        cancellationReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    ChangeTaskStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/TaskStatus"
        comment: { type: string, maxLength: 1000 }

    AssignTaskRequest:
      type: object
      required: [assignedToMembershipId]
      properties:
        assignedToMembershipId: { type: string, format: uuid }

    AssignCarriedTaskRequest:
      type: object
      required: [assignedToMembershipId, deadlineType]
      properties:
        assignedToMembershipId: { type: string, format: uuid }
        deadlineType:
          $ref: "#/components/schemas/TaskDeadlineType"
        deadlineAt:
          type: [string, "null"]
          format: date-time
          description: Обязательно только при deadlineType=TIME.

    TaskHistoryResponse:
      type: object
      required: [id, eventType, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventType:
          type: string
          enum: [CREATED, UPDATED, ASSIGNED, STATUS_CHANGED, CARRIED_OVER, CANCELLED, ARCHIVED]
        actorMembershipId: { type: [string, "null"], format: uuid }
        oldStatus: { type: [string, "null"] }
        newStatus: { type: [string, "null"] }
        oldAssigneeMembershipId: { type: [string, "null"], format: uuid }
        newAssigneeMembershipId: { type: [string, "null"], format: uuid }
        comment: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    ShiftStatus:
      type: string
      enum: [PLANNED, ACTIVE, CLOSED, CANCELLED]

    CreateShiftRequest:
      type: object
      required: [scheduledStartAt, scheduledEndAt]
      properties:
        scheduledStartAt: { type: string, format: date-time }
        scheduledEndAt: { type: string, format: date-time }

    ConfigureShiftRequest:
      type: object
      required: [participants]
      description: |
        Должность берётся из workforce-service. Каждый активный стол должен встретиться ровно
        один раз у официанта и ровно один раз у раннера.
      properties:
        participants:
          type: array
          items:
            type: object
            required: [membershipId, tableIds]
            properties:
              membershipId: { type: string, format: uuid }
              tableIds:
                type: array
                minItems: 1
                uniqueItems: true
                items: { type: string, format: uuid }

    ShiftParticipantResponse:
      type: object
      required: [membershipId, position, tableIds]
      properties:
        membershipId: { type: string, format: uuid }
        position:
          $ref: "#/components/schemas/EmployeePosition"
        tableIds:
          type: array
          items: { type: string, format: uuid }

    ShiftResponse:
      type: object
      required:
        - id
        - restaurantId
        - name
        - scheduledStartAt
        - scheduledEndAt
        - status
        - responsibleMembershipId
        - participants
        - tasks
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        name: { type: string }
        scheduledStartAt: { type: string, format: date-time }
        scheduledEndAt: { type: string, format: date-time }
        actualStartedAt: { type: [string, "null"], format: date-time }
        actualClosedAt: { type: [string, "null"], format: date-time }
        status:
          $ref: "#/components/schemas/ShiftStatus"
        responsibleMembershipId: { type: string, format: uuid }
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ShiftParticipantResponse"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskResponse"

    ShiftSummaryResponse:
      type: object
      required:
        [id, name, scheduledStartAt, scheduledEndAt, status, responsibleMembershipId, employeeCount, taskCount, completedTaskCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scheduledStartAt: { type: string, format: date-time }
        scheduledEndAt: { type: string, format: date-time }
        actualStartedAt: { type: [string, "null"], format: date-time }
        actualClosedAt: { type: [string, "null"], format: date-time }
        status:
          $ref: "#/components/schemas/ShiftStatus"
        responsibleMembershipId: { type: string, format: uuid }
        employeeCount: { type: integer, minimum: 0 }
        taskCount: { type: integer, minimum: 0 }
        completedTaskCount: { type: integer, minimum: 0 }

    ShiftReportResponse:
      type: object
      required:
        [shiftId, restaurantId, actualStartedAt, actualClosedAt, managerMembershipId, employeeMembershipIds, totalTasks, completedTasks, cancelledTasks, carriedOverTasks]
      properties:
        shiftId: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        actualStartedAt: { type: string, format: date-time }
        actualClosedAt: { type: string, format: date-time }
        managerMembershipId: { type: string, format: uuid }
        employeeMembershipIds:
          type: array
          items: { type: string, format: uuid }
        totalTasks: { type: integer, minimum: 0 }
        completedTasks: { type: integer, minimum: 0 }
        cancelledTasks: { type: integer, minimum: 0 }
        carriedOverTasks: { type: integer, minimum: 0 }

    CurrentShiftResponse:
      type: object
      required:
        - id
        - restaurantId
        - scheduledStartAt
        - scheduledEndAt
        - actualStartedAt
        - status
        - assignedTableIds
        - tasks
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        scheduledStartAt: { type: string, format: date-time }
        scheduledEndAt: { type: string, format: date-time }
        actualStartedAt: { type: string, format: date-time }
        status:
          $ref: "#/components/schemas/ShiftStatus"
        assignedTableIds:
          type: array
          items: { type: string, format: uuid }
        tasks:
          type: array
          description: Сначала незавершённые по ближайшему дедлайну, затем выполненные по времени выполнения.
          items:
            $ref: "#/components/schemas/TaskResponse"

    UnfinishedTaskAction:
      type: string
      enum: [CARRY_OVER, CANCEL]

    CloseShiftRequest:
      type: object
      required: [unfinishedTasks]
      properties:
        unfinishedTasks:
          type: array
          description: Решение менеджера по каждой незавершённой задаче закрываемой смены.
          items:
            type: object
            required: [taskId, action]
            properties:
              taskId:
                type: string
                format: uuid
              action:
                $ref: "#/components/schemas/UnfinishedTaskAction"
              comment:
                type: string
                maxLength: 1000

x-websocket:
  url: /api/v1/ws
  status: draft
  events:
    - TABLE_STATUS_CHANGED
    - TASK_CREATED
    - TASK_ASSIGNED
    - TASK_UPDATED
    - SHIFT_PARTICIPANT_JOINED
    - SHIFT_PARTICIPANT_LEFT
    - SHIFT_CLOSED
    - NOTIFICATION_CREATED
