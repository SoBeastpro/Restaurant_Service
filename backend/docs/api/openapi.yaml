openapi: 3.1.0

info:
  title: REST Restaurant Public Gateway API
  version: 0.2.0
  description: |
    Публичный контракт мобильных приложений iOS и Android.
    Клиенты подключаются только к API Gateway; внутренние адреса микросервисов не являются
    частью публичного API. Владельцы маршрутов зафиксированы в
    `backend/contracts/gateway/routes.yaml`.

x-architecture: microservices
x-entrypoint: api-gateway

servers:
  - url: /api/v1
    description: Базовый путь API

security:
  - bearerAuth: []

tags:
  - name: Auth
    x-owner-service: identity-service
  - name: Profile
    x-owner-service: api-gateway
  - name: Restaurants
    x-owner-service: restaurant-service
  - name: Employees
    x-owner-service: workforce-service
  - name: Invitations
    x-owner-service: workforce-service
  - name: Halls
    x-owner-service: restaurant-service
  - name: Tables
    x-owner-service: restaurant-service
  - name: Shifts
    x-owner-service: operations-service
  - name: Attendance
    x-owner-service: operations-service
  - name: Tasks
    x-owner-service: operations-service
  - name: Task templates
    x-owner-service: operations-service
  - name: Notifications
    x-owner-service: notification-service
  - name: Statistics
    x-owner-service: reporting-service
  - name: Audit
    x-owner-service: audit-service
  - name: Subscription
    x-owner-service: billing-service
  - name: Platform
    x-owner-service: api-gateway

paths:
  /auth/register-manager:
    post:
      tags: [Auth]
      summary: Зарегистрировать менеджера
      operationId: registerManager
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterManagerRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        default:
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      tags: [Auth]
      summary: Выполнить вход
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Вход выполнен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        default:
          $ref: "#/components/responses/Error"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Обновить пару токенов
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Токены обновлены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        default:
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Завершить текущую сессию
      operationId: logout
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Завершить все сессии пользователя
      operationId: logoutAll
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /auth/email/verify:
    post:
      tags: [Auth]
      summary: Подтвердить email
      operationId: verifyEmail
      security: []
      requestBody:
        $ref: "#/components/requestBodies/TokenRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Error"

  /auth/email/resend:
    post:
      tags: [Auth]
      summary: Повторно отправить подтверждение email
      operationId: resendEmailVerification
      security: []
      requestBody:
        $ref: "#/components/requestBodies/LoginValueRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Запросить восстановление пароля
      operationId: forgotPassword
      security: []
      requestBody:
        $ref: "#/components/requestBodies/LoginValueRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Установить новый пароль по токену
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Error"

  /auth/password/change:
    post:
      tags: [Auth]
      summary: Изменить пароль
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /auth/sessions:
    get:
      tags: [Auth]
      summary: Получить активные сессии
      operationId: listSessions
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /auth/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [Auth]
      summary: Завершить выбранную сессию
      operationId: deleteSession
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /me:
    get:
      tags: [Profile]
      summary: Получить свой профиль
      operationId: getMyProfile
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    patch:
      tags: [Profile]
      summary: Изменить свой профиль
      operationId: updateMyProfile
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /me/restaurants:
    get:
      tags: [Profile]
      summary: Получить рестораны и роли текущего пользователя
      operationId: listMyRestaurants
      responses:
        "200":
          description: Доступные профили пользователя в ресторанах
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RestaurantMembershipSummary"

  /me/avatar:
    post:
      tags: [Profile]
      summary: Загрузить фотографию профиля
      operationId: uploadMyAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [Profile]
      summary: Удалить фотографию профиля
      operationId: deleteMyAvatar
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /me/permissions:
    get:
      tags: [Profile]
      summary: Получить permissions текущего пользователя
      operationId: getMyPermissions
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /me/current-shift:
    get:
      tags: [Profile]
      summary: Получить текущую смену пользователя
      operationId: getMyCurrentShift
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /me/notifications:
    get:
      tags: [Notifications]
      summary: Получить уведомления
      operationId: listMyNotifications
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /me/notifications/{notificationId}/read:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    patch:
      tags: [Notifications]
      summary: Отметить уведомление прочитанным
      operationId: readNotification
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /me/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Отметить все уведомления прочитанными
      operationId: readAllNotifications
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /me/devices:
    post:
      tags: [Notifications]
      summary: Зарегистрировать push-токен устройства
      operationId: registerDevice
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /me/devices/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    delete:
      tags: [Notifications]
      summary: Удалить устройство
      operationId: deleteDevice
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /restaurants:
    post:
      tags: [Restaurants]
      summary: Создать ресторан
      operationId: createRestaurant
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /restaurants/{restaurantId}:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    get:
      tags: [Restaurants]
      summary: Получить профиль ресторана
      operationId: getRestaurant
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    patch:
      tags: [Restaurants]
      summary: Изменить профиль ресторана
      operationId: updateRestaurant
      x-access: Manager
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [Restaurants]
      summary: Архивировать ресторан
      operationId: archiveRestaurant
      x-access: Manager
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /restaurants/{restaurantId}/logo:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    post:
      tags: [Restaurants]
      summary: Загрузить логотип ресторана
      operationId: uploadRestaurantLogo
      x-access: Manager
      requestBody:
        $ref: "#/components/requestBodies/FileBody"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [Restaurants]
      summary: Удалить логотип ресторана
      operationId: deleteRestaurantLogo
      x-access: Manager
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /restaurants/{restaurantId}/employees:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    get:
      tags: [Employees]
      summary: Получить сотрудников ресторана
      operationId: listEmployees
      x-access: Manager
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /restaurants/{restaurantId}/employees/{employeeId}:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/EmployeeId"
    get:
      tags: [Employees]
      summary: Получить карточку сотрудника
      operationId: getEmployee
      x-access: Manager
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    patch:
      tags: [Employees]
      summary: Изменить имя, фамилию или должность сотрудника
      operationId: updateEmployee
      x-access: Manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [Employees]
      summary: Архивировать сотрудника
      operationId: archiveEmployee
      x-access: Manager
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /restaurants/{restaurantId}/employees/{employeeId}/status:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/EmployeeId"
    patch:
      tags: [Employees]
      summary: Изменить статус сотрудника
      operationId: updateEmployeeStatus
      x-access: Manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/EmployeeStatus"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /restaurants/{restaurantId}/employees/{employeeId}/shifts:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/EmployeeId"
    get:
      tags: [Employees]
      summary: Получить историю смен сотрудника
      operationId: listEmployeeShifts
      x-access: Manager
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /restaurants/{restaurantId}/employees/{employeeId}/statistics:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/EmployeeId"
    get:
      tags: [Statistics]
      summary: Получить статистику сотрудника
      operationId: getEmployeeStatistics
      x-access: Manager
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /restaurants/{restaurantId}/invitations:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    get:
      tags: [Invitations]
      summary: Получить приглашения ресторана
      operationId: listInvitations
      x-access: Manager
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    post:
      tags: [Invitations]
      summary: Создать сотрудника и приглашение
      operationId: createInvitation
      x-access: Manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Приглашение создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        default:
          $ref: "#/components/responses/Error"

  /restaurants/{restaurantId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/InvitationId"
    delete:
      tags: [Invitations]
      summary: Отозвать приглашение
      operationId: revokeInvitation
      x-access: Manager
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /restaurants/{restaurantId}/invitations/{invitationId}/resend:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/InvitationId"
    post:
      tags: [Invitations]
      summary: Перевыпустить или повторно отправить приглашение
      operationId: resendInvitation
      x-access: Manager
      responses:
        "200":
          description: Приглашение обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"

  /invitations/{token}:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    get:
      tags: [Invitations]
      summary: Проверить приглашение
      operationId: getInvitationByToken
      security: []
      responses:
        "200":
          description: Данные приглашения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInvitationResponse"
        default:
          $ref: "#/components/responses/Error"

  /invitations/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    post:
      tags: [Invitations]
      summary: Принять приглашение и активировать аккаунт
      operationId: acceptInvitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Аккаунт активирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        default:
          $ref: "#/components/responses/Error"

  /restaurants/{restaurantId}/halls:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    get:
      tags: [Halls]
      summary: Получить залы ресторана
      operationId: listHalls
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    post:
      tags: [Halls]
      summary: Создать зал
      operationId: createHall
      x-access: Manager
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /restaurants/{restaurantId}/halls/{hallId}:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/HallId"
    get:
      tags: [Halls]
      summary: Получить зал и его план
      operationId: getHall
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    patch:
      tags: [Halls]
      summary: Изменить зал
      operationId: updateHall
      x-access: Manager
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [Halls]
      summary: Архивировать зал
      operationId: archiveHall
      x-access: Manager
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /restaurants/{restaurantId}/halls/{hallId}/tables:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/HallId"
    post:
      tags: [Tables]
      summary: Добавить стол в зал
      operationId: createTable
      x-access: Manager
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /restaurants/{restaurantId}/tables:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    get:
      tags: [Tables]
      summary: Получить столы ресторана
      operationId: listTables
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /restaurants/{restaurantId}/tables/{tableId}:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/TableId"
    get:
      tags: [Tables]
      summary: Получить стол
      operationId: getTable
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    patch:
      tags: [Tables]
      summary: Изменить стол
      operationId: updateTable
      x-access: Manager
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [Tables]
      summary: Архивировать стол
      operationId: archiveTable
      x-access: Manager
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /restaurants/{restaurantId}/tables/{tableId}/status-changes:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/TableId"
    post:
      tags: [Tables]
      summary: Изменить состояние стола
      operationId: changeTableStatus
      x-access: TBD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeTableStatusRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /restaurants/{restaurantId}/tables/{tableId}/status-history:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/TableId"
    get:
      tags: [Tables]
      summary: Получить историю состояний стола
      operationId: getTableStatusHistory
      x-access: Manager
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /restaurants/{restaurantId}/shifts:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    get:
      tags: [Shifts]
      summary: Получить смены
      operationId: listShifts
      x-access: Manager
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    post:
      tags: [Shifts]
      summary: Запланировать смену
      operationId: createShift
      x-access: Manager
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /restaurants/{restaurantId}/shifts/current:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    get:
      tags: [Shifts]
      summary: Получить активную смену ресторана
      operationId: getCurrentShift
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /restaurants/{restaurantId}/shifts/{shiftId}:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/ShiftId"
    get:
      tags: [Shifts]
      summary: Получить смену
      operationId: getShift
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    patch:
      tags: [Shifts]
      summary: Изменить запланированную смену
      operationId: updateShift
      x-access: Manager
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /restaurants/{restaurantId}/shifts/{shiftId}/start:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/ShiftId"
    post:
      tags: [Shifts]
      summary: Начать смену
      operationId: startShift
      x-access: Manager
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "409":
          $ref: "#/components/responses/Conflict"

  /restaurants/{restaurantId}/shifts/{shiftId}/close:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/ShiftId"
    post:
      tags: [Shifts]
      summary: Завершить смену
      operationId: closeShift
      x-access: Manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseShiftRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /restaurants/{restaurantId}/shifts/{shiftId}/report:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/ShiftId"
    get:
      tags: [Shifts]
      summary: Получить отчёт смены
      operationId: getShiftReport
      x-access: Manager
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /restaurants/{restaurantId}/shifts/{shiftId}/participants:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/ShiftId"
    get:
      tags: [Attendance]
      summary: Получить участников смены
      operationId: listShiftParticipants
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    post:
      tags: [Attendance]
      summary: Добавить сотрудника в смену
      operationId: addShiftParticipant
      x-access: Manager
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
