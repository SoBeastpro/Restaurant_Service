openapi: 3.1.0

info:
  title: REST Restaurant Public Gateway API
  version: 0.2.0
  description: |
    Публичный контракт мобильных приложений iOS и Android.
    Клиенты подключаются только к API Gateway; внутренние адреса микросервисов не являются
    частью публичного API. Владельцы маршрутов зафиксированы в
    `backend/contracts/gateway/routes.yaml`.

x-architecture: microservices
x-entrypoint: api-gateway

servers:
  - url: /api/v1
    description: Базовый путь API

security:
  - bearerAuth: []

tags:
  - name: Auth
    x-owner-service: identity-service
  - name: Profile
    x-owner-service: api-gateway
  - name: Onboarding
    x-owner-service: identity-service
  - name: Restaurants
    x-owner-service: restaurant-service
  - name: Employees
    x-owner-service: workforce-service
  - name: Invitations
    x-owner-service: workforce-service
  - name: Halls
    x-owner-service: restaurant-service
  - name: Tables
    x-owner-service: restaurant-service
  - name: Shifts
    x-owner-service: operations-service
  - name: Attendance
    x-owner-service: operations-service
  - name: Tasks
    x-owner-service: operations-service
  - name: Task templates
    x-owner-service: operations-service
  - name: Notifications
    x-owner-service: notification-service
  - name: Statistics
    x-owner-service: reporting-service
  - name: Audit
    x-owner-service: audit-service
  - name: Subscription
    x-owner-service: billing-service
  - name: Platform
    x-owner-service: api-gateway

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Зарегистрировать пользователя
      description: |
        Публичная регистрация доступна только директору ресторана. Сервер автоматически
        назначает роль DIRECTOR. MANAGER и EMPLOYEE регистрируются только по QR-приглашению.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        default:
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      tags: [Auth]
      summary: Выполнить вход
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Вход выполнен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        default:
          $ref: "#/components/responses/Error"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Обновить пару токенов
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Токены обновлены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        default:
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Завершить текущую сессию
      operationId: logout
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Завершить все сессии пользователя
      operationId: logoutAll
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Запросить восстановление пароля
      operationId: forgotPassword
      security: []
      requestBody:
        $ref: "#/components/requestBodies/LoginValueRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Установить новый пароль по токену
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Error"

  /auth/password/change:
    post:
      tags: [Auth]
      summary: Изменить пароль
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /auth/sessions:
    get:
      tags: [Auth]
      summary: Получить активные сессии
      operationId: listSessions
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /auth/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [Auth]
      summary: Завершить выбранную сессию
      operationId: deleteSession
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /me:
    get:
      tags: [Profile]
      summary: Получить свой профиль
      operationId: getMyProfile
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    patch:
      tags: [Profile]
      summary: Изменить свой профиль
      operationId: updateMyProfile
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /me/restaurants:
    get:
      tags: [Profile]
      summary: Получить рестораны и роли текущего пользователя
      operationId: listMyRestaurants
      responses:
        "200":
          description: Доступные профили пользователя в ресторанах
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RestaurantMembershipSummary"

  /me/avatar:
    post:
      tags: [Profile]
      summary: Загрузить фотографию профиля
      operationId: uploadMyAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [Profile]
      summary: Удалить фотографию профиля
      operationId: deleteMyAvatar
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /me/permissions:
    get:
      tags: [Profile]
      summary: Получить permissions текущего пользователя
      operationId: getMyPermissions
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /me/current-shift:
    get:
      tags: [Profile]
      summary: Получить текущую смену пользователя
      operationId: getMyCurrentShift
      responses:
        "200":
          description: Открытая смена, столы и личный план текущего сотрудника
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentShiftResponse"

  /me/notifications:
    get:
      tags: [Notifications]
      summary: Получить уведомления
      operationId: listMyNotifications
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Уведомления текущего пользователя от новых к старым
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationResponse"

  /me/notifications/{notificationId}/read:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    patch:
      tags: [Notifications]
      summary: Отметить уведомление прочитанным
      operationId: readNotification
      responses:
        "200":
          description: Уведомление отмечено прочитанным
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"

  /me/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Отметить все уведомления прочитанными
      operationId: readAllNotifications
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /me/devices:
    post:
      tags: [Notifications]
      summary: Зарегистрировать push-токен устройства
      operationId: registerDevice
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /me/devices/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    delete:
      tags: [Notifications]
      summary: Удалить устройство
      operationId: deleteDevice
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /onboarding/subscription:
    get:
      tags: [Onboarding]
      summary: Получить состояние локальной заглушки подписки
      description: Доступно директору до создания ресторана. Платёжная система не вызывается.
      operationId: getOnboardingSubscription
      x-access: Director
      responses:
        "200":
          description: Состояние заглушки подписки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingSubscription"
        default:
          $ref: "#/components/responses/Error"

  /onboarding/subscription/activate:
    post:
      tags: [Onboarding]
      summary: Активировать локальную заглушку подписки на 30 дней
      description: Повторный запрос при активной подписке не изменяет дату окончания.
      operationId: activateOnboardingSubscriptionStub
      x-access: Director
      responses:
        "200":
          description: Заглушка подписки активирована
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingSubscription"
        default:
          $ref: "#/components/responses/Error"

  /restaurants:
    post:
      tags: [Restaurants]
      summary: Создать ресторан с недельным графиком
      operationId: createRestaurant
      x-access: Director
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRestaurantRequest"
      responses:
        "201":
          description: Ресторан создан и связан с директором
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantResponse"
        default:
          $ref: "#/components/responses/Error"

  /restaurants/{restaurantId}:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    get:
      tags: [Restaurants]
      summary: Получить профиль ресторана
      operationId: getRestaurant
      x-access: Director or Manager
      responses:
        "200":
          description: Ресторан с недельным графиком
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantResponse"
    patch:
      tags: [Restaurants]
      summary: Изменить профиль ресторана
      operationId: updateRestaurant
      x-access: Manager
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [Restaurants]
      summary: Архивировать ресторан
      operationId: archiveRestaurant
      x-access: Manager
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /restaurants/{restaurantId}/logo:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    post:
      tags: [Restaurants]
      summary: Загрузить логотип ресторана
      operationId: uploadRestaurantLogo
      x-access: Manager
      requestBody:
        $ref: "#/components/requestBodies/FileBody"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [Restaurants]
      summary: Удалить логотип ресторана
      operationId: deleteRestaurantLogo
      x-access: Manager
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /restaurants/{restaurantId}/employees:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    get:
      tags: [Employees]
      summary: Получить сотрудников ресторана
      operationId: listEmployees
      x-access: Director or Manager
      responses:
        "200":
          description: Активные сотрудники ресторана
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeResponse"

  /restaurants/{restaurantId}/employees/{employeeId}:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/EmployeeId"
    get:
      tags: [Employees]
      summary: Получить карточку сотрудника
      operationId: getEmployee
      x-access: Manager
      responses:
        "200":
          description: Список смен с сохранёнными итоговыми метриками закрытых смен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShiftSummaryResponse"
    patch:
      tags: [Employees]
      summary: Изменить имя, фамилию или должность сотрудника
      operationId: updateEmployee
      x-access: Manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: Смена завершена, итоговый отчёт сохранён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftReportResponse"
    delete:
      tags: [Employees]
      summary: Архивировать сотрудника
      operationId: archiveEmployee
      x-access: Manager
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /restaurants/{restaurantId}/employees/{employeeId}/status:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/EmployeeId"
    patch:
      tags: [Employees]
      summary: Изменить статус сотрудника
      operationId: updateEmployeeStatus
      x-access: Manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/EmployeeStatus"
      responses:
        "200":
          description: Сохранённый итог смены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftReportResponse"

  /restaurants/{restaurantId}/employees/{employeeId}/shifts:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/EmployeeId"
    get:
      tags: [Employees]
      summary: Получить историю смен сотрудника
      operationId: listEmployeeShifts
      x-access: Manager
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /restaurants/{restaurantId}/employees/{employeeId}/statistics:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/EmployeeId"
    get:
      tags: [Statistics]
      summary: Получить статистику сотрудника
      operationId: getEmployeeStatistics
      x-access: Manager
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /restaurants/{restaurantId}/invitations:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    get:
      tags: [Invitations]
      summary: Получить приглашения ресторана
      operationId: listInvitations
      description: Директор видит все приглашения; менеджер — приглашения сотрудников.
      x-access: Director or Manager
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    post:
      tags: [Invitations]
      summary: Создать сотрудника и приглашение
      operationId: createInvitation
      description: Менеджер может создавать приглашения только с ролью EMPLOYEE.
      x-access: Director or Manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Приглашение создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        default:
          $ref: "#/components/responses/Error"

  /restaurants/{restaurantId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/InvitationId"
    delete:
      tags: [Invitations]
      summary: Отозвать приглашение
      operationId: revokeInvitation
      description: Менеджер может отзывать приглашения сотрудников, включая созданные директором.
      x-access: Director or Manager
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /restaurants/{restaurantId}/invitations/{invitationId}/resend:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/InvitationId"
    post:
      tags: [Invitations]
      summary: Перевыпустить приглашение
      operationId: resendInvitation
      description: Менеджер может перевыпускать приглашения сотрудников, включая созданные директором.
      x-access: Director or Manager
      responses:
        "200":
          description: Приглашение обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"

  /invitations/{token}:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    get:
      tags: [Invitations]
      summary: Проверить приглашение
      operationId: getInvitationByToken
      security: []
      responses:
        "200":
          description: Данные приглашения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInvitationResponse"
        default:
          $ref: "#/components/responses/Error"

  /invitations/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    post:
      tags: [Invitations]
      summary: Принять приглашение и активировать аккаунт
      operationId: acceptInvitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Аккаунт активирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        default:
          $ref: "#/components/responses/Error"

  /restaurants/{restaurantId}/halls:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    get:
      tags: [Halls]
      summary: Получить залы ресторана
      operationId: listHalls
      x-access: Director or Manager
      responses:
        "200":
          description: Залы ресторана
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HallResponse"
    post:
      tags: [Halls]
      summary: Создать зал
      operationId: createHall
      x-access: Director or Manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHallRequest"
      responses:
        "201":
          description: Зал создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HallResponse"

  /restaurants/{restaurantId}/halls/{hallId}:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/HallId"
    get:
      tags: [Halls]
      summary: Получить зал и его план
      operationId: getHall
      x-access: Director or Manager
      responses:
        "200":
          description: Зал
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HallResponse"
    patch:
      tags: [Halls]
      summary: Изменить зал
      operationId: updateHall
      x-access: Manager
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [Halls]
      summary: Архивировать зал
      operationId: archiveHall
      x-access: Manager
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /restaurants/{restaurantId}/halls/{hallId}/tables:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/HallId"
    post:
      tags: [Tables]
      summary: Добавить стол в зал
      operationId: createTable
      x-access: Director or Manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTableRequest"
      responses:
        "201":
          description: Стол создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableResponse"

  /restaurants/{restaurantId}/tables:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    get:
      tags: [Tables]
      summary: Получить столы ресторана
      operationId: listTables
      x-access: Director or Manager
      responses:
        "200":
          description: Столы ресторана
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableResponse"

  /restaurants/{restaurantId}/tables/{tableId}:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/TableId"
    get:
      tags: [Tables]
      summary: Получить стол
      operationId: getTable
      x-access: Director or Manager
      responses:
        "200":
          description: Стол
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableResponse"
    patch:
      tags: [Tables]
      summary: Изменить стол
      operationId: updateTable
      x-access: Director or Manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTableRequest"
      responses:
        "200":
          description: Стол обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableResponse"
    delete:
      tags: [Tables]
      summary: Архивировать стол
      operationId: archiveTable
      x-access: Manager
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /restaurants/{restaurantId}/tables/{tableId}/status-changes:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/TableId"
    post:
      tags: [Tables]
      summary: Изменить состояние стола
      operationId: changeTableStatus
      description: |
        Закреплённый официант устанавливает NEEDS_CLEANING, NEEDS_SERVING или PROBLEM;
        закреплённый раннер возвращает стол в READY. Директор и менеджер могут установить
        любой статус. Переходы между статусами не ограничены.
      x-access: Assigned waiter, assigned runner, Director or Manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeTableStatusRequest"
      responses:
        "200":
          description: Статус изменён, история и уведомления созданы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableStatusResponse"

  /restaurants/{restaurantId}/tables/status-history:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    get:
      tags: [Tables]
      summary: Получить журнал статусов столов ресторана
      operationId: getRestaurantTableStatusHistory
      x-access: Director or Manager
      parameters:
        - name: tableId
          in: query
          schema: { type: string, format: uuid }
        - name: shiftId
          in: query
          schema: { type: string, format: uuid }
        - name: changedByMembershipId
          in: query
          schema: { type: string, format: uuid }
          description: Фронтенд выбирает сотрудника по имени и передаёт его membershipId.
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: Исключительная верхняя граница периода.
      responses:
        "200":
          description: Отфильтрованный журнал статусов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableStatusHistoryResponse"

  /restaurants/{restaurantId}/tables/{tableId}/status-history:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
      - $ref: "#/components/parameters/TableId"
    get:
      tags: [Tables]
      summary: Получить историю состояний стола
      operationId: getTableStatusHistory
      x-access: Director or Manager
      parameters:
        - name: shiftId
          in: query
          schema: { type: string, format: uuid }
          description: Ограничить историю одной сменой.
      responses:
        "200":
          description: История статусов стола от новых записей к старым
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableStatusHistoryResponse"

