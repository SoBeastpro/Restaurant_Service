components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 20 }
    HallId:
      name: hallId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TableId:
      name: tableId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  requestBodies:
    JsonBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonObject"
    OptionalJsonBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonObject"
    TokenRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string }
    LoginValueRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [login]
            properties:
              login: { type: string }
    FileBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary }

  responses:
    Ok:
      description: Операция выполнена
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonObject"
    Created:
      description: Объект создан
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonObject"
    NoContent:
      description: Операция выполнена без тела ответа
    Conflict:
      description: Конфликт текущего состояния
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Error:
      description: Ошибка выполнения запроса
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    JsonObject:
      type: object
      additionalProperties: true
      description: Предварительная схема; будет заменена после утверждения ERD.

    ApiError:
      type: object
      required: [status, code, message]
      properties:
        status: { type: integer, example: 409 }
        code: { type: string, example: ACTIVE_SHIFT_ALREADY_EXISTS }
        message: { type: string, example: В ресторане уже есть активная смена }
        path: { type: string, example: /api/v1/restaurants/.../shifts/.../start }
        timestamp: { type: string, format: date-time }
        fieldErrors:
          type: object
          additionalProperties:
            type: string

    RegisterManagerRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }

    LoginRequest:
      type: object
      required: [login, password, profileType]
      properties:
        login: { type: string }
        password: { type: string, format: password }
        profileType:
          $ref: "#/components/schemas/ProfileType"

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Срок access-токена в секундах }
        restaurants:
          type: array
          description: Рестораны, доступные в выбранном режиме входа.
          items:
            $ref: "#/components/schemas/RestaurantMembershipSummary"

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, format: password, minLength: 8 }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8 }

    EmployeePosition:
      type: string
      enum: [MANAGER, WAITER, RUNNER]

    ProfileType:
      type: string
      enum: [MANAGER, EMPLOYEE]

    RestaurantMembershipSummary:
      type: object
      required: [restaurantId, restaurantName, position, status]
      properties:
        restaurantId: { type: string, format: uuid }
        restaurantName: { type: string }
        position:
          $ref: "#/components/schemas/EmployeePosition"
        status:
          $ref: "#/components/schemas/EmployeeStatus"

    EmployeeStatus:
      type: string
      enum: [INVITED, ACTIVE, INACTIVE, BLOCKED, ARCHIVED]
      description: Статус профиля пользователя в конкретном ресторане.

    InvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]

    CreateInvitationRequest:
      type: object
      required: [firstName, lastName, position]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: Анна
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: Соколова
        position:
          $ref: "#/components/schemas/EmployeePosition"

    InvitationResponse:
      type: object
      required: [id, employeeId, firstName, lastName, position, status, invitationUrl, expiresAt]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        firstName: { type: string, example: Анна }
        lastName: { type: string, example: Соколова }
        position:
          $ref: "#/components/schemas/EmployeePosition"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        invitationUrl: { type: string, format: uri }
        qrContent:
          type: string
          description: Содержимое QR-кода; совпадает с безопасной ссылкой.
        expiresAt: { type: string, format: date-time }

    PublicInvitationResponse:
      type: object
      required: [restaurantName, firstName, lastName, position, expiresAt]
      properties:
        restaurantName: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        position:
          $ref: "#/components/schemas/EmployeePosition"
        expiresAt: { type: string, format: date-time }

    AcceptInvitationRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 100
          example: anna.sokolova
          description: Устанавливается один раз и после активации аккаунта не изменяется.
        password:
          type: string
          format: password
          minLength: 8
          description: Создаёт пароль для нового аккаунта или подтверждает существующий аккаунт.

    UpdateEmployeeRequest:
      type: object
      minProperties: 1
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        position:
          $ref: "#/components/schemas/EmployeePosition"

    TableStatus:
      type: string
      enum: [NEEDS_CLEANING, NEEDS_SERVING, READY, PROBLEM]

    ChangeTableStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/TableStatus"
        comment:
          type: string
          minLength: 1
          maxLength: 1000
          description: Обязателен для статуса PROBLEM.
      allOf:
        - if:
            properties:
              status:
                const: PROBLEM
            required: [status]
          then:
            required: [comment]

    TaskStatus:
      type: string
      enum: [CREATED, IN_PROGRESS, COMPLETED, CANCELLED]
      description: |
        Сотрудник: CREATED → IN_PROGRESS → COMPLETED.
        Менеджер: CREATED или IN_PROGRESS → COMPLETED или CANCELLED.

    ChangeTaskStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/TaskStatus"
        comment: { type: string, maxLength: 1000 }

    ShiftStatus:
      type: string
      enum: [PLANNED, ACTIVE, CLOSED, CANCELLED]

    UnfinishedTaskAction:
      type: string
      enum: [CARRY_OVER, CANCEL]

    CloseShiftRequest:
      type: object
      required: [unfinishedTasks]
      properties:
        unfinishedTasks:
          type: array
          description: Решение менеджера по каждой незавершённой задаче закрываемой смены.
          items:
            type: object
            required: [taskId, action]
            properties:
              taskId:
                type: string
                format: uuid
              action:
                $ref: "#/components/schemas/UnfinishedTaskAction"
              comment:
                type: string
                maxLength: 1000

x-websocket:
  url: /api/v1/ws
  status: draft
  events:
    - TABLE_STATUS_CHANGED
    - TASK_CREATED
    - TASK_ASSIGNED
    - TASK_UPDATED
    - SHIFT_PARTICIPANT_JOINED
    - SHIFT_PARTICIPANT_LEFT
    - SHIFT_CLOSED
    - NOTIFICATION_CREATED
