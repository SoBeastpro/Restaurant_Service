spring:
  application:
    name: workforce-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-migration-naming: true
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://identity.restaurant.internal}
          audiences: ["${JWT_AUDIENCE:restaurant-api}"]

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: ${spring.application.name}
    version: 0.2.0

logging:
  pattern:
    level: "%5p [service:${spring.application.name}] [requestId:%X{requestId:-}]"

services:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081}

