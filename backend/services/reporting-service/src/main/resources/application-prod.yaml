spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:true}

server:
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs

internal:
  api-secret: ${INTERNAL_API_SECRET}

services:
  identity:
    url: ${IDENTITY_SERVICE_URL}
  restaurant:
    url: ${RESTAURANT_SERVICE_URL}
  billing:
    url: ${BILLING_SERVICE_URL}

