spring:
  application:
    name: reporting-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-migration-naming: true
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8088}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: ${spring.application.name}
    version: 0.2.0

logging:
  pattern:
    level: "%5p [service:${spring.application.name}] [requestId:%X{requestId:-}]"

